# ── tmux ────────────────────────────────────────────────────────────────
# Prefix: Ctrl+Space   ·   Reload: prefix r   ·   Cheatsheet: `cheat`
# Plugins (TPM): prefix I installs · prefix U updates

# ── Prefix ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal: true color, extended keys, images, clipboard ──────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:extkeys:usstyle"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g allow-passthrough on          # yazi images (kitty protocol) inside tmux
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s set-clipboard on
set -g focus-events on
set -s escape-time 10

# ── Behavior ────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off         # when a session closes, switch to another instead of exiting
set -g display-time 2000
setw -g mode-keys vi
set -g status-position top

# ── Keys ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits in the current directory:  prefix |  and  prefix -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes: Ctrl+h/j/k/l (vim-tmux-navigator, also into/out of nvim)
# Clear screen (Ctrl+l is taken by navigation): prefix Ctrl+l
bind C-l send-keys C-l
# Ctrl+k is taken by navigation too; bash's kill-to-end-of-line: prefix Ctrl+k
bind C-k send-keys C-k

# Resize: prefix H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Windows: prefix 1..9 direct · prefix n / p next/previous (tmux defaults).
# No Alt+N bindings: Ghostty uses Alt+1..9 for its tabs, and Alt+. is bash's
# "insert last argument".
bind < swap-window -t -1 \; previous-window
bind > swap-window -t +1 \; next-window

# Floating popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind D display-popup -E -w 90% -h 90% lazydocker
bind b display-popup -E -w 90% -h 90% btop
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
# Switch session with fzf
bind S display-popup -E -w 60% -h 50% "tmux list-sessions -F '#S' | fzf --reverse --header='Jump to session' | xargs -r tmux switch-client -t"

# vi-style copy mode: prefix [ · v select · y copy (to clipboard via tmux-yank)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Catppuccin theme (Mocha / Latte following GNOME) ────────────────────
set -g @catppuccin_flavor "mocha"
if-shell 'gsettings get org.gnome.desktop.interface color-scheme | grep -q light' \
    'set -g @catppuccin_flavor "latte"'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ── Plugins ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'          # prefix u: open a URL from the screen

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'              # restore the last session when tmux starts
set -g @continuum-save-interval '15'
set -g @fzf-url-fzf-options '-w 60% -h 50% --multi -0 --no-preview'

# TPM always last
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
