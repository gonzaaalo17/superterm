"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt, no powerline segments:
#     ~/Projects/syntropic    dev ⇡4 !2 +1 ?1  +12 -3   v3.13  took 4s
#   ❯
# Nerd Font glyphs are written as \uXXXX escapes on purpose: raw private-use
# characters get lost easily when this file is edited or copied.
# The palette switches to Latte automatically in GNOME light mode (see ~/.bashrc.d/20-tools.sh).

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

format = """
$os$directory$git_branch$git_commit$git_state$git_status$git_metrics\
$python$java$rust$nodejs$golang$docker_context$cmd_duration$jobs$status
$character"""

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
Fedora = ""
Linux = ""

[directory]
style = "bold blue"
format = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " \U000f033e"

# ── Git ─────────────────────────────────────────────────────────────────
# Legend (also in `cheat`):
#   ⇡N commits to push · ⇣N commits to pull · ⇕ diverged
#   +N staged · !N modified · ?N untracked · ✘N deleted · »N renamed
#   ≡N stashes · =N conflicts · +A -D lines added/removed (uncommitted)

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
style = "bold green"
tag_disabled = false
only_detached = true
tag_symbol = "  "
format = "[$hash$tag]($style) "

[git_state]
style = "bold yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "peach"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
up_to_date = ""
untracked = "?$count "
stashed = "≡$count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# ── Languages and tools ─────────────────────────────────────────────────
[python]
symbol = " "
style = "yellow"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "sky"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[ $duration]($style) "

[jobs]
symbol = " "
style = "teal"

[status]
disabled = false
symbol = " "
style = "red"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

