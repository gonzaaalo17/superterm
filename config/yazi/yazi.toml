[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
max_width = 1600
max_height = 1200

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Markdown preview rendered with glow (piper plugin). $t = terminal light/dark mode.
[[plugin.prepend_previewers]]
url = "*.{md,markdown,MD}"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s="$([ "$t" = light ] && echo light || echo dark)" "$1"'
